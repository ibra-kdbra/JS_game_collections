<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Tower Defense</title>
    <link href="css/style.css" rel="stylesheet">
    <link href="./imgs/tower.svg" rel="icon" type="image/svg+xml" />
    <link href="./imgs/tower.png" rel="icon" type="image/png" />
    <script type="module" src="../assets/kit/index.js"></script>
    <script src="vendor/p5-1.11.2.min.js" defer></script>
    <script src="vendor/lz-string-1.5.0.min.js" defer></script>
    <script src="scripts/utils.js" defer></script>
    <script src="scripts/ui.js" defer></script>
    <script src="scripts/audio.js" defer></script>
    <script src="scripts/enemy.js" defer></script>
    <script src="scripts/enemies.js" defer></script>
    <script src="scripts/particle.js" defer></script>
    <script src="scripts/particle_system.js" defer></script>
    <script src="scripts/effect.js" defer></script>
    <script src="scripts/effects.js" defer></script>
    <script src="scripts/tower.js" defer></script>
    <script src="scripts/towers.js" defer></script>
    <script src="scripts/missile.js" defer></script>
    <script src="scripts/maps.js" defer></script>
    <script src="scripts/tiles.js" defer></script>
    <script src="scripts/waves.js" defer></script>
    <script src="scripts/sketch.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Tower Defense</h1>
    </header>

    <main>
      <aside id="store">
        <h2>Store</h2>
        <div class="store-grid">
          <button class="gun" data-tower="gun"><span>Gun</span><b>$25</b><kbd>1</kbd></button>
          <button class="laser" data-tower="laser"><span>Laser</span><b>$75</b><kbd>2</kbd></button>
          <button class="slow" data-tower="slow"><span>Slow</span><b>$100</b><kbd>3</kbd></button>
          <button class="sniper" data-tower="sniper"><span>Sniper</span><b>$150</b><kbd>4</kbd></button>
          <button class="rocket" data-tower="rocket"><span>Rocket</span><b>$250</b><kbd>5</kbd></button>
          <button class="bomb" data-tower="bomb"><span>Bomb</span><b>$250</b><kbd>6</kbd></button>
          <button class="tesla" data-tower="tesla"><span>Tesla</span><b>$300</b><kbd>7</kbd></button>
        </div>
      </aside>

      <div id="sketch-holder"></div>

      <div id="side">
        <aside id="status">
          <div class="stats">
            <span id="wave">Wave 1</span>
            <span id="health">&#9829; 40</span>
            <span id="cash">$55</span>
          </div>
          <div class="horiz-buttons">
            <button id="pause">Start</button>
            <button id="speed" title="Game speed (T)">1x</button>
            <button id="next-wave" title="Call the next wave early for bonus cash (N)">Next</button>
          </div>
          <p id="wave-note"></p>
        </aside>

        <aside id="info">
          <div id="info-div">
            <h3 id="name"></h3>
            <dl class="info-stats">
              <dt>Damage</dt><dd id="damage"></dd>
              <dt>Type</dt><dd id="type"></dd>
              <dt>Range</dt><dd id="range"></dd>
              <dt>Cooldown</dt><dd id="cooldown"></dd>
              <dt>Value</dt><dd id="sellPrice"></dd>
            </dl>
            <div class="horiz-buttons" id="info-buttons">
              <button id="sell">Sell</button>
              <button id="upgrade">Upgrade</button>
            </div>
            <div class="horiz-buttons" id="place-buttons">
              <button id="cancel">Cancel (Esc)</button>
            </div>
          </div>
          <p id="hint"></p>
        </aside>

        <details id="options" open>
          <summary>Game &amp; maps</summary>
          <label>Map
            <select id="map">
              <optgroup label="Random">
                <option value="empty2">Empty (2 spawns)</option>
                <option value="empty3">Empty (3 spawns)</option>
                <option value="sparse2" selected>Sparse (2 spawns)</option>
                <option value="sparse3">Sparse (3 spawns)</option>
                <option value="dense2">Dense (2 spawns)</option>
                <option value="dense3">Dense (3 spawns)</option>
                <option value="solid2">Solid (2 spawns)</option>
                <option value="solid3">Solid (3 spawns)</option>
              </optgroup>
              <optgroup label="Designed">
                <option value="spiral">Spiral</option>
                <option value="loops">Loops</option>
                <option value="branch">Branch</option>
                <option value="branchAlt">Branch (Alt)</option>
                <option value="fork">Fork</option>
                <option value="walls">Walls</option>
                <option value="city">City</option>
                <option value="freeway">Freeway</option>
              </optgroup>
              <optgroup label="Yours">
                <option id="custom" value="custom" disabled>Custom (import or editor)</option>
              </optgroup>
            </select>
          </label>
          <label>Mode
            <select id="mode">
              <option value="campaign" selected>Campaign (30 waves)</option>
              <option value="endless">Endless (random waves)</option>
            </select>
          </label>
          <label>Difficulty
            <select id="difficulty">
              <option value="easy">Easy</option>
              <option value="normal" selected>Normal</option>
              <option value="hard">Hard</option>
            </select>
          </label>
          <p id="best"></p>
          <div class="horiz-buttons">
            <button id="restart">Restart (R)</button>
            <button id="mute">Sound on</button>
          </div>
          <div class="horiz-buttons">
            <button class="io" id="import">Import map</button>
            <button class="io" id="export">Export map</button>
          </div>
          <p><a href="../td-editor/index.html">Open the map editor</a></p>
        </details>
      </div>
    </main>

    <dialog id="end-dialog" class="td-dialog">
      <form method="dialog">
        <h2 id="end-title"></h2>
        <p id="end-text"></p>
        <div class="dialog-buttons">
          <button value="close" class="dialog-cancel">Look at the map</button>
          <button value="retry" class="dialog-ok">Play again</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
