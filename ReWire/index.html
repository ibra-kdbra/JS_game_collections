<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>ReWire</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="../assets/kit/index.js"></script>
</head>
<body>
<div id='game'>
    <div id='content'></div>
    <div id='levelInfo' class='blueFont hidden'>Level 6</div>
    <div id='nodeInfo' class='blueFont hidden'>3 / 10</div>
    <div id="main-menu" class="center hidden">
        <div id='title'>
            <div class="circuit-logo">
                <div class="core"></div>
                <div class="ring"></div>
                <div class="ring"></div>
                <div class="ring"></div>
            </div>
            <h1 class="logo-text">REWIRE</h1>
        </div>
        <div id='description' class='blueFont'>
            <div class="status-line">System Status: <span>Offline</span></div>
            <h2>Bring the System back online by rewiring the power nodes.</h2>
            <h3>Progress is saved automatically. Jump to any level from the level list.</h3>
        </div>
        <div id='menu'>
            <a id='startBtn' class="btn" href="#" role="button">START NEW GAME</a>
            <a id='continueBtn' class="btn" href="#" role="button">CONTINUE GAME</a>
            <a id='menuLevelsBtn' class="btn" href="#" role="button">LEVELS</a>
        </div>
    </div>
    <div id='loading' class='center hidden'></div>
    <div id='levelDone' class='center hidden'>
        <div><h1 id='nextMsg' class='blueFont'>Level completed!</h1></div>
        <a id='nextBtn' class="btn" href="#" role="button">NEXT LEVEL</a>
    </div>
    <div id='levelSelect' class='center hidden' role="dialog" aria-label="Levels">
        <h2 class='blueFont'>Levels</h2>
        <div id='levelGrid'></div>
        <a id='closeLevelsBtn' class="btn" href="#" role="button">CLOSE</a>
    </div>
    <div id='reset' class='hidden'>
        <a id='resetBtn' class='btn' href="#" role="button">RESET</a>
        <a id='levelsBtn' class='btn' href="#" role="button">LEVELS</a>
        <a id='backBtn' class='btn hidden' href="#" role="button">BACK</a>
        <a id='skipBtn' class='btn hidden' href="#" role="button">NEXT</a>
    </div>
    <div id="settings-container">
        <button id="toggleMusic" class="settings-btn" title="Toggle music" aria-label="Music" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/><path class="slash" d="M3 3l18 18"/></svg>
        </button>
        <button id="toggleFx" class="settings-btn" title="Toggle sound effects" aria-label="Sound effects" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4z"/><path class="wave" d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/><path class="slash" d="M3 3l18 18"/></svg>
        </button>
    </div>
</div>

<script src="js/types.js" defer></script>
<script src="js/utils.js" defer></script>
<script src="js/math-util.js" defer></script>
<script src="js/vector.js" defer></script>
<script src="js/canvas.js" defer></script>
<script src="js/audio.js" defer></script>
<script src="js/html.js" defer></script>
<script src="js/gfx-generator.js" defer></script>
<script src="js/input.js" defer></script>
<script src="js/space.js" defer></script>
<script src="js/mouse-drag-system.js" defer></script>
<script src="js/render-systems.js" defer></script>
<script src="js/spool-system.js" defer></script>
<script src="js/game.js" defer></script>
<script src="js/level.js" defer></script>
<script src="js/resources.js" defer></script>
<script src="js/start.js" defer></script>

</body>
</html>
