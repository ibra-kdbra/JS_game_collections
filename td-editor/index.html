<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#09090b">
    <title>Map Editor</title>
    <link href="css/style.css" rel="stylesheet">
    <link href="../assets/icons/map.svg" rel="icon" type="image/svg+xml" />
    <script type="module" src="../assets/kit/index.js"></script>
    <script src="../TowerDefense/vendor/p5-1.11.2.min.js" defer></script>
    <script src="../TowerDefense/vendor/lz-string-1.5.0.min.js" defer></script>
    <script src="../TowerDefense/scripts/ui.js" defer></script>
    <script src="../TowerDefense/scripts/maps.js" defer></script>
    <script src="scripts/utils.js" defer></script>
    <script src="scripts/tiles.js" defer></script>
    <script src="../TowerDefense/scripts/terrain.js" defer></script>
    <script src="../TowerDefense/scripts/art.js" defer></script>
    <script src="scripts/sketch.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Map Editor</h1>
    </header>

    <main>
      <aside id="tiles">
        <div class="layer-seg" role="group" aria-label="Layer (Space)">
          <button type="button" data-layer="game" aria-pressed="true" onclick="if (dispMode) toggleDispMode()">Gameplay</button>
          <button type="button" data-layer="deco" aria-pressed="false" onclick="if (!dispMode) toggleDispMode()">Decoration</button>
        </div>
        <div id="tile-picker">
          <h2>Tiles</h2>
          <div class="group">
            <p><button class="empty" data-tile="empty">Open ground (1)</button></p>
            <p><button class="wall" data-tile="wall">Wall (2)</button></p>
            <p><button class="path" data-tile="path">Path (3)</button></p>
            <p><button class="tower" data-tile="tower">Tower pad (4)</button></p>
            <p><button class="enemy" data-tile="enemy">Enemy-only road (5)</button></p>
          </div>
  
          <h2>Special</h2>
          <div class="group">
            <p><button class="spawn" data-tile="spawn">Spawn portal (6)</button></p>
            <p><button class="exit" data-tile="exit">Exit gate (7)</button></p>
          </div>
  
          <h2>Paths</h2>
          <div class="group">
            <p><button class="dir" data-tile="none">No Path (0)</button></p>
            <p><button class="dir" data-tile="left">Left Path (left)</button></p>
            <p><button class="dir" data-tile="up">Up Path (up)</button></p>
            <p><button class="dir" data-tile="right">Right Path (right)</button></p>
            <p><button class="dir" data-tile="down">Down Path (down)</button></p>
          </div>
        </div>
        <div id="deco-picker">
          <h2>Decorative</h2>
          <div class="group">
            <p><button class="emptyD light" data-deco="empty">Empty Tile (1)</button></p>
            <p><button class="wallD light" data-deco="wall">Wall Tile (2)</button></p>
            <p><button class="towerD light" data-deco="tower">Tower Tile (3)</button></p>
          </div>

          <h2>Direction</h2>
          <div class="group">
            <p><button class="dir" data-deco="none">None (0)</button></p>
            <p><button class="dir" data-deco="left">Left (left)</button></p>
            <p><button class="dir" data-deco="up">Up (up)</button></p>
            <p><button class="dir" data-deco="right">Right (right)</button></p>
            <p><button class="dir" data-deco="down">Down (down)</button></p>
          </div>

          <h2>City</h2>
          <div class="group">
            <p><button class="grass" data-deco="grass">Grass (4)</button></p>
            <p><button class="road" data-deco="road">Road Tile (5)</button></p>
            <p><button class="road" data-deco="lCorner">Left Corner (6)</button></p>
            <p><button class="road" data-deco="rCorner">Right Corner (7)</button></p>
            <p><button class="sidewalk" data-deco="sidewalk">Sidewalk (8)</button></p>
          </div>

          <h2>Neon</h2>
          <div class="group">
            <p><button class="neon_pink" data-deco="neon_pink">Pink</button></p>
            <p><button class="neon_yellow" data-deco="neon_yellow">Yellow</button></p>
            <p><button class="neon_green" data-deco="neon_green">Green</button></p>
            <p><button class="neon_orange" data-deco="neon_orange">Orange</button></p>
            <p><button class="neon_purple light" data-deco="neon_purple">Purple</button></p>
          </div>

          <h2>Colors</h2>
          <div class="group">
            <p><button class="c0_lightBrown" data-deco="c0_lightBrown">Light Brown</button></p>
            <p><button class="c0_lightPurple" data-deco="c0_lightPurple">Light Purple</button></p>
            <p><button class="c0_mediumPurple light" data-deco="c0_mediumPurple">Medium Purple</button></p>
            <p><button class="c0_darkPurple light" data-deco="c0_darkPurple">Dark Purple</button></p>
            <p><button class="c0_paleGreen" data-deco="c0_paleGreen">Pale Green</button></p>
          </div>
          <div class="group">
            <p><button class="c1_darkBlue light" data-deco="c1_darkBlue">Dark Blue</button></p>
            <p><button class="c1_mediumBlue light" data-deco="c1_mediumBlue">Medium Blue</button></p>
            <p><button class="c1_lightBlue" data-deco="c1_lightBlue">Light Blue</button></p>
            <p><button class="c1_darkPurple light" data-deco="c1_darkPurple">Dark Purple</button></p>
            <p><button class="c1_neonPink" data-deco="c1_neonPink">Neon Pink</button></p>
          </div>
          <div class="group">
            <p><button class="c2_darkRed light" data-deco="c2_darkRed">Dark Red</button></p>
            <p><button class="c2_navyBlue light" data-deco="c2_navyBlue">Navy Blue</button></p>
            <p><button class="c2_darkBlue light" data-deco="c2_darkBlue">Dark Blue</button></p>
            <p><button class="c2_paleYellow" data-deco="c2_paleYellow">Pale Yellow</button></p>
            <p><button class="c2_lightYellow" data-deco="c2_lightYellow">Light Yellow</button></p>
          </div>
        </div>
      </aside>

      <div id="sketch-holder"></div>

      <div class="aside-holder">
        <aside id="status">
          <h2>Map</h2>
          <label class="theme-row" for="campaign-map"><span>Open</span>
            <select id="campaign-map">
              <option value="">Campaign map&hellip;</option>
            </select>
          </label>
          <p id="dim"></p>
          <p id="coord">Tile: (0, 0)</p>
          <div class="size-row">
            <span>Columns</span>
            <button class="zoom" onclick="changeSize(-1, 0)" aria-label="Fewer columns">&minus;</button>
            <button class="zoom" onclick="changeSize(1, 0)" aria-label="More columns">+</button>
          </div>
          <div class="size-row">
            <span>Rows</span>
            <button class="zoom" onclick="changeSize(0, -1)" aria-label="Fewer rows">&minus;</button>
            <button class="zoom" onclick="changeSize(0, 1)" aria-label="More rows">+</button>
          </div>
          <label class="theme-row" for="theme"><span>Look</span>
            <select id="theme">
              <option value="auto">Automatic</option>
              <option value="meadow">Meadow</option>
              <option value="city">City</option>
              <option value="desert">Desert</option>
              <option value="frost">Frost</option>
              <option value="void">Void</option>
              <option value="ash">Ashlands</option>
            </select>
          </label>
          <p><button class="play" onclick="playMap()">Play this map</button></p>
        </aside>

        <aside id="utils">
          <h2>Utilities</h2>
          <div class="group">
            <p><button class="fill" onclick="resetMap(0)">Reset Map (R)</button></p>
            <p><button class="fill" onclick="userFill()">Fill Selected (F)</button></p>
          </div>
          <div class="group">
            <p><button class="io" onclick="showImportMapPrompt()">Import map (M)</button></p>
            <p><button class="io" onclick="showExportMap()">Export map (X)</button></p>
          </div>
          <div class="group">
            <p><button class="dir" onclick="recalculate()">Auto-Pathfind (P)</button></p>
            <p><button class="dir" onclick="paths=buildArray(cols,rows,0)">Clear Pathfinding (Q)</button></p>
          </div>
          <div class="group">
            <p><button class="disp" onclick="toggleDispMode()">Display Mode (Space)</button></p>
            <p><button class="disp" id="autogen" onclick="toggleAutogen()">Turn Autogen Off (D)</button></p>
            <p><button class="disp" onclick="genDisplay()">Update Display (U)</button></p>
            <p><button class="disp" onclick="displayDir=copyArray(paths)">Display Paths (L)</button></p>
            <p><button class="disp" onclick="display=buildArray(cols,rows,'empty');displayDir=buildArray(cols,rows,0)">Clear Display (C)</button></p>
          </div>
          <p><button class="spawn" onclick="spawnpoints=[]">Clear Spawns (S)</button></p>
          <p><button class="zoom" onclick="resetZoom()">Reset Zoom (Z)</button></p>
        </aside>
      </div>
    </main>
  </body>
</html>
