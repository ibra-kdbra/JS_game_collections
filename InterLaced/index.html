<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Interlaced</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <script type="module" src="../assets/kit/index.js"></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="display">
      <div id="game-container">
        <div id="screen" class="hide">
          <div class="title">GOLIATH NETWORK VISUALIZER</div>
          <div class="mesh-id"><div id="spinner" class="spinner">&#x169b</div> mesh://<span id="mesh-id"></span></div>
          <div class="health">Network Health: <span id="health">100%</span></div>
          <div id="toolbar">
            <div data-tool="info">&#x24D8<div id="info-use"></div></div>
            <div data-tool="crash">&#x2349<div id="crash-use"></div></div>
            <div data-tool="cut">&#x27DB<div id="cut-use"></div></div>
            <div data-tool="slow">&#x21DD<div id="slow-use"></div></div>
            <div data-tool="corrupt">&#x2A02<div id="corrupt-use"></div></div>
            <div data-tool="reroute">&#x21AC<div id="reroute-use"></div></div>
            <div data-tool="intercept">&#x291E<div id="intercept-use"></div></div>
            <div data-tool="mine">&#x22C7<div id="mine-use"></div></div>
          </div>
          <svg id="mesh"></svg>
          <div id="coins"></div><div id="data"></div>
          <pre id="info"></pre>
          <pre id="console"></pre>
          <div id="retry"><span id="retry-text"></span>&#x21BB</div>
          <div id="quit"><span id="quit-text"></span>&#x21CF</div>
        </div>
        <pre id="terminal"></pre>
        <pre id="crash" class="hide"></pre>
        <div id="offline" class="hide">
          <div id="offline-banner">OFFLINE</div>
          <div id="continue"></div>
        </div>
      </div>
    </div>

    <div id="touchbar" class="hide">
      <div id="quick"></div>
      <form id="cmd-form" class="hide">
        <span class="prompt">interlaced#</span>
        <input id="cmd-input" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-label="Command">
        <button type="submit">Enter</button>
      </form>
      <button id="continue-btn" type="button" class="hide">Continue &#x23CE;</button>
    </div>

    <button id="sound" type="button" aria-label="Sound" aria-pressed="false" title="Sound">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4z"/><path class="wave" d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/><path class="slash" d="M22 9l-6 6M16 9l6 6"/></svg>
    </button>

    <a href="https://github.com/ibra-kdbra/JS_game_collections/tree/main/InterLaced" target="_blank" rel="noopener noreferrer" class="github-link" title="View Source on GitHub">
      <img src="../assets/icons/github-icon.svg" alt="GitHub" class="github-icon">
    </a>
  </body>
</html>
