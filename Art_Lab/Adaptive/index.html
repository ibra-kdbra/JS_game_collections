<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="../js/embed.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#09090b">
  <meta name="description" content="A noise-driven flow field of particles. Tune the field, the trails and the colours, and stir it with your finger or mouse.">
  <title>Adaptive Fields</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="../../assets/icons/ornamental_floral.svg" type="image/svg+xml">
</head>
<body>
  <canvas id="field" aria-label="Flow field animation. Drag on it to stir the particles." role="img"></canvas>

  <div class="hud" id="hud">
    <button type="button" class="chip" id="btn-play" aria-pressed="false" title="Pause or play (Space)">Pause</button>
    <button type="button" class="chip" id="btn-panel" aria-expanded="true" aria-controls="panel" title="Show or hide the controls (H)">Controls</button>
  </div>

  <aside class="panel" id="panel" aria-label="Flow field controls">
    <header class="panel-head">
      <h1>Adaptive Fields</h1>
      <p class="fps" id="fps" aria-live="off"></p>
    </header>

    <div class="panel-body">
      <section class="group" aria-label="Presets">
        <h2>Presets</h2>
        <div class="row-buttons" id="presets"></div>
      </section>

      <section class="group" aria-label="Particles">
        <h2>Particles</h2>
        <label class="slider">
          <span>Count <output for="count" id="count-out"></output></span>
          <input type="range" id="count" min="200" max="12000" step="100">
        </label>
        <label class="slider">
          <span>Speed <output for="speed" id="speed-out"></output></span>
          <input type="range" id="speed" min="0.2" max="6" step="0.1">
        </label>
        <label class="slider">
          <span>Size <output for="size" id="size-out"></output></span>
          <input type="range" id="size" min="0.5" max="4" step="0.1">
        </label>
        <label class="slider">
          <span>Opacity <output for="opacity" id="opacity-out"></output></span>
          <input type="range" id="opacity" min="0.02" max="1" step="0.01">
        </label>
      </section>

      <section class="group" aria-label="Field">
        <h2>Field</h2>
        <label class="slider">
          <span>Noise scale <output for="scale" id="scale-out"></output></span>
          <input type="range" id="scale" min="40" max="1200" step="10">
        </label>
        <label class="slider">
          <span>Curl <output for="curl" id="curl-out"></output></span>
          <input type="range" id="curl" min="0.25" max="8" step="0.05">
        </label>
        <label class="slider">
          <span>Drift <output for="drift" id="drift-out"></output></span>
          <input type="range" id="drift" min="0" max="1" step="0.01">
        </label>
        <label class="slider">
          <span>Trail fade <output for="fade" id="fade-out"></output></span>
          <input type="range" id="fade" min="0" max="0.3" step="0.005">
        </label>
        <fieldset class="seg" aria-label="At the edge">
          <legend>At the edge</legend>
          <label><input type="radio" name="edge" value="wrap"><span>Wrap</span></label>
          <label><input type="radio" name="edge" value="respawn"><span>Respawn</span></label>
        </fieldset>
      </section>

      <section class="group" aria-label="Colours">
        <h2>Colours</h2>
        <div class="colours">
          <label class="swatch"><input type="color" id="color-a"><span>Ink</span></label>
          <label class="swatch"><input type="color" id="color-b"><span>Second</span></label>
          <label class="swatch"><input type="color" id="color-bg"><span>Ground</span></label>
        </div>
        <label class="toggle"><input type="checkbox" id="two-tone"><span>Use the second colour</span></label>
      </section>

      <section class="group actions" aria-label="Actions">
        <button type="button" class="btn btn-primary" id="btn-random" title="Randomise (R)">Randomise</button>
        <button type="button" class="btn" id="btn-seed" title="New noise seed (N)">New seed</button>
        <button type="button" class="btn" id="btn-clear" title="Clear the canvas (C)">Clear</button>
        <button type="button" class="btn" id="btn-reset">Reset</button>
        <button type="button" class="btn" id="btn-save">Save PNG</button>
      </section>
      <p class="hint">Drag on the canvas to stir the field.</p>
    </div>
  </aside>

  <script src="script.js"></script>
</body>
</html>
